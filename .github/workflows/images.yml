name: Runtime images
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulator: classic
            ros_distro: humble
          - simulator: harmonic
            ros_distro: jazzy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.simulator }},enable={{is_default_branch}}
            type=semver,pattern={{version}}-${{ matrix.simulator }}
            type=ref,event=pr,suffix=-${{ matrix.simulator }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: ROS_DISTRO=${{ matrix.ros_distro }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.simulator }}
          cache-to: type=gha,mode=max,scope=${{ matrix.simulator }}
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          image="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker run --rm "$image" --help
          docker run --rm "$image" ros2 pkg executables gazebo_ros2_2dmap_plugin | grep generate_map.sh
